name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EMBEDDING_BACKEND: tfidf   # offline path: no model download, no API key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scikit-learn python-dotenv pytest \
                      langgraph langchain-core

      - name: Run tests
        run: pytest -q

      - name: Run evaluation (regression gate)
        run: python -m eval.run_eval --k 4
